[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-gestion-gastos"
version = "0.1.0"
description = "Aplicacion de escritorio para gestionar gastos personales"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"PySide6>=6.7",
	"matplotlib>=3.9",
	"rapidfuzz>=3.9",
	"pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
app-gestion-gastos = "app_gestion_gastos.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]